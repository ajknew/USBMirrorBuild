name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'usb-screen-mirror-project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build USB Screen Mirror
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f usb-screen-mirror-project.zip ]; then
            echo "::error::usb-screen-mirror-project.zip not found"
            exit 1
          fi

          mkdir -p project
          unzip -q usb-screen-mirror-project.zip -d project

          echo "=== Extracted project files ==="
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              -name settings.gradle -o -name settings.gradle.kts \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Gradle wrapper (gradlew) not found"
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle or app/build.gradle.kts not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Selected project ==="
          echo "$PROJECT_DIR"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -
