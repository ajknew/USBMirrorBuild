name: Build USB Screen Mirror APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'usb-screen-mirror-project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract Android project
        run: |
          set -euo pipefail

          test -f usb-screen-mirror-project.zip

          mkdir -p project
          unzip -o usb-screen-mirror-project.zip -d project

          echo "=== Project files ==="
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        id: locate
        run: |
          set -euo pipefail

          SETTINGS="$(find project \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) not found"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: .
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Gradle project directory ==="
          pwd

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Building APK ==="
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        id: verify
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR/app/build" -maxdepth 6 -type f || true
            exit 1
          fi

          echo "APK_PATH=$APK"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: USBMirror-debug-APK
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7
