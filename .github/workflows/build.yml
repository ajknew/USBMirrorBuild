name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'usb-screen-mirror-project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build USB Screen Mirror
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Verify project archive
        run: |
          set -eu

          if [ ! -f usb-screen-mirror-project.zip ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            ls -la
            exit 1
          fi

          unzip -t usb-screen-mirror-project.zip

      - name: Extract project
        run: |
          set -eu
          mkdir -p project
          unzip -q usb-screen-mirror-project.zip -d project
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -eu

          SETTINGS_FILE=$(find project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: File settings.gradle(.kts) tidak ditemukan."
            find project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Konfigurasi Gradle modul app tidak ditemukan."
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Lokasi proyek: $PROJECT_DIR"

      - name: Build Debug APK
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -eu
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Verify APK
        if: success()
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -eu

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if ! find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          ls -lh "$APK_DIR"/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: USBMirror-debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
