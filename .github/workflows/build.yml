name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'usb-screen-mirror-project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build USB Screen Mirror
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$GITHUB_WORKSPACE/usb-screen-mirror-project.zip" ]; then
            echo "::error::usb-screen-mirror-project.zip not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$GITHUB_WORKSPACE/usb-screen-mirror-project.zip" \
            -d "$GITHUB_WORKSPACE/project"

          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/project"
          SETTINGS_FILE=""

          SETTINGS_FILE=$(find "$ROOT" -type f -name settings.gradle -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find "$ROOT" -type f -name settings.gradle.kts -print -quit)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found"
            echo "=== Available project files ==="
            find "$ROOT" -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "=== Gradle project directory ==="
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Gradle wrapper gradlew not found"
            echo "=== Searching for Gradle wrapper ==="
            find "$ROOT" -type f -name gradlew
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle build file not found"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found"
            exit 1
          fi

          echo "=== SDK Manager ==="
          echo "$SDKMANAGER"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Java ==="
          java -version

          echo "=== Gradle wrapper ==="
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK file not found"
            echo "=== Searching generated APK files ==="
            find "$PROJECT_DIR" -type f -name '*.apk'
            exit 1
          fi

          echo "=== APK BUILD SUCCESS ==="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USBMirror-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
 
